[workspace]
resolver = "2"
members = ["cleanslate-core", "cleanslate-ffi", "cleanslate-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cleanslate-core = { path = "cleanslate-core" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
csbindgen = "1.9.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
winreg = "0.56.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
strsim = "0.11.1"
criterion = "0.8.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
