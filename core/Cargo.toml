[workspace]
resolver = "2"
members = ["cleanslate-core", "cleanslate-ffi", "cleanslate-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cleanslate-core = { path = "cleanslate-core" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
csbindgen = "1.9.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
winreg = "0.56.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
