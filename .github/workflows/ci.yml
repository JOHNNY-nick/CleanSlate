name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    runs-on: windows-latest
    # The workspace of the hosted runner (D:\a\...) does not resolve to itself: the guard of
    # rule 6 refuses the test folders made there (13 tests, first run of 4 Nov. 2026). The
    # job works on a copy of the repository on C:, the guard stays as it is.
    defaults:
      run:
        working-directory: C:\cs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy the repository to C:\cs
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          Get-Item -Force $env:GITHUB_WORKSPACE, (Split-Path $env:GITHUB_WORKSPACE) | Format-List FullName, LinkType, Target, Attributes
          robocopy . C:\cs /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: C:\cs\core -> target

      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov,cargo-deny

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: cargo fmt
        working-directory: C:\cs\core
        run: cargo fmt --all --check

      # Supply chain (B1, D96): RustSec advisories, licenses, sources (core/deny.toml).
      - name: cargo deny
        working-directory: C:\cs\core
        run: cargo deny check

      - name: cargo clippy
        working-directory: C:\cs\core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: C:\cs\core
        run: cargo test --workspace

      - name: cargo test, with the guard of the test commands (D53)
        working-directory: C:\cs\core
        run: cargo test --workspace --all-features

      - name: Coverage of the engine (ENF-12, >= 80 %)
        working-directory: C:\cs\core
        run: cargo llvm-cov --workspace --fail-under-lines 80 --summary-only

      # Scripts run with -File: the step fails on their real exit code (each ends with an explicit exit).
      - name: Build (cargo + dotnet)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build.ps1 -Configuration Release
          exit $LASTEXITCODE

      - name: The Release CLI has no test command (D53)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/check-release-cli.ps1 -Binary core/target/release/cleanslate-cli.exe -RunHelp
          exit $LASTEXITCODE

      - name: Arguments of the Sandbox scripts, Windows PowerShell 5.1 (fake program, D56)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/sandbox-arguments.tests.ps1
          exit $LASTEXITCODE

      - name: Arguments of the Sandbox scripts, PowerShell 7 (fake program, D56)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/sandbox-arguments.tests.ps1
          exit $LASTEXITCODE

      - name: Main programs of the Apps scenario, Windows PowerShell 5.1 (D58)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/sandbox-programs.tests.ps1
          exit $LASTEXITCODE

      - name: Main programs of the Apps scenario, PowerShell 7 (D58)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/sandbox-programs.tests.ps1
          exit $LASTEXITCODE

      - name: Silent classic uninstall of the Apps scenario, Windows PowerShell 5.1 (D59)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/sandbox-uninstall.tests.ps1
          exit $LASTEXITCODE

      - name: Silent classic uninstall of the Apps scenario, PowerShell 7 (D59)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/sandbox-uninstall.tests.ps1
          exit $LASTEXITCODE

      - name: Exit codes of check-release-cli.ps1 (clean 0, feature 1, missing 2)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/check-release-cli.tests.ps1
          exit $LASTEXITCODE

      - name: NativeMethods.g.cs is up to date
        shell: pwsh
        run: git diff --exit-code -- app/CleanSlate.Interop/NativeMethods.g.cs

      - name: dotnet test
        run: dotnet test app/CleanSlate.sln -c Release -p:Platform=x64 --no-build

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CleanSlate-win-x64
          path: C:\cs\app\CleanSlate.App\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\
