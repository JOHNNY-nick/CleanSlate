name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: cargo fmt
        working-directory: core
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: core
        run: cargo test --workspace

      - name: cargo test, with the guard of the test commands (D53)
        working-directory: core
        run: cargo test --workspace --all-features

      - name: Coverage of the engine (ENF-12, >= 80 %)
        working-directory: core
        run: cargo llvm-cov --workspace --fail-under-lines 80 --summary-only

      # Scripts run with -File: the step fails on their real exit code (each ends with an explicit exit).
      - name: Build (cargo + dotnet)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build.ps1 -Configuration Release
          exit $LASTEXITCODE

      - name: The Release CLI has no test command (D53)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/check-release-cli.ps1 -Binary core/target/release/cleanslate-cli.exe -RunHelp
          exit $LASTEXITCODE

      - name: Arguments of the Sandbox scripts, Windows PowerShell 5.1 (fake program, D56)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/sandbox-arguments.tests.ps1
          exit $LASTEXITCODE

      - name: Arguments of the Sandbox scripts, PowerShell 7 (fake program, D56)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/sandbox-arguments.tests.ps1
          exit $LASTEXITCODE

      - name: Main programs of the Apps scenario, Windows PowerShell 5.1 (D58)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/sandbox-programs.tests.ps1
          exit $LASTEXITCODE

      - name: Main programs of the Apps scenario, PowerShell 7 (D58)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/sandbox-programs.tests.ps1
          exit $LASTEXITCODE

      - name: Exit codes of check-release-cli.ps1 (clean 0, feature 1, missing 2)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/tests/check-release-cli.tests.ps1
          exit $LASTEXITCODE

      - name: NativeMethods.g.cs is up to date
        shell: pwsh
        run: git diff --exit-code -- app/CleanSlate.Interop/NativeMethods.g.cs

      - name: dotnet test
        run: dotnet test app/CleanSlate.sln -c Release -p:Platform=x64 --no-build

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: CleanSlate-win-x64
          path: app/CleanSlate.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
